# Render Blueprint Configuration for Autonomous SEO Agent Background Worker
services:
  - type: worker
    name: seo-agent-worker
    runtime: node
    region: oregon # or ohio, frankfurt, singapore
    plan: starter # Starter plan ($7/mo) for 24/7 always-on persistent worker
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_CONCURRENCY
        value: "3"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LEONARDO_API_KEY
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
